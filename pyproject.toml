[project]
name = "atelier-p2p"
version = "0.1.0"
description = "Procure-to-pay AI pipeline: documents -> validated data -> quality agent -> analytics copilot, with evals at every stage."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "faker>=25.0",
  "pandas>=2.2",
  "duckdb>=1.0",
  "pyyaml>=6.0",
  "openai>=3.51.0",
]

[project.optional-dependencies]
datagen = ["jinja2>=3.1", "weasyprint>=62", "pdf2image>=1.17", "pillow>=10", "numpy>=1.26", "opencv-python-headless>=4.9"]
extraction = ["pdfplumber>=0.11", "pymupdf>=1.24", "pytesseract>=0.3", "rapidfuzz>=3.9", "fastapi>=0.111", "uvicorn>=0.30", "python-multipart>=0.0.9"]
warehouse = ["dbt-core>=1.8", "dbt-duckdb>=1.8"]
copilot = ["sqlglot>=25.0"]
app = ["streamlit>=1.35"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "pre-commit>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p2p"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
